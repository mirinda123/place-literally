map $uri $feedback_rate_key {
    default "";
    /atlas-api/feedback $binary_remote_addr;
}

map $uri $vector_rate_key {
    default "";
    ~^/atlas-api/features/[^/]+/vector-similar$ $binary_remote_addr;
}

limit_req_zone $feedback_rate_key zone=feedback:10m rate=5r/m;
limit_req_zone $vector_rate_key zone=vector:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # The public gateway is the only caller; use the original client IP for limits.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;

    location /atlas-api/ {
        limit_req zone=feedback burst=5 nodelay;
        limit_req zone=vector burst=10 nodelay;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
